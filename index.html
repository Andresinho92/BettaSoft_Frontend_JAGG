 <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BettaSoft - Inicio de Sesión</title>

    <!-- Hoja de estilos principal de BettaSoft -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >
</head>

<body class="login-body">

    <main class="login-container">

        <article class="login-card">

            <!-- Identidad visual de BettaSoft -->
            <header class="login-header">

                <div class="logo-icon" aria-hidden="true">
                    <i class="bi bi-water"></i>
                </div>

                <h1>BettaSoft</h1>

                <p class="subtitle">
                    Gestión inteligente de acuarios y peces
                </p>

            </header>


            <!-- Formulario de inicio de sesión -->
            <form
                id="form-login"
                class="login-form"
                novalidate
                autocomplete="on"
            >

                <!-- Mensajes de validación controlados por JavaScript -->
                <div
                    id="error-message"
                    class="alert-message"
                    role="alert"
                    aria-live="polite"
                ></div>


                <!-- Campo de usuario -->
                <div class="input-group-custom">

                    <label for="usuario">
                        <i class="bi bi-person-fill" aria-hidden="true"></i>
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- Campo de contraseña -->
                <div class="input-group-custom">

                    <label for="contrasena">
                        <i class="bi bi-lock-fill" aria-hidden="true"></i>
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- Botón de acceso -->
                <button
                    type="submit"
                    class="btn-login"
                >
                    Iniciar sesión
                    <i
                        class="bi bi-box-arrow-in-right"
                        aria-hidden="true"
                    ></i>
                </button>

            </form>


            <!-- Pie de página -->
            <footer class="login-footer">

                <p>
                    &copy; 2026 BettaSoft.
                    Prototipo Front-End ADSO.
                </p>

            </footer>

        </article>

    </main>


    <!-- JavaScript principal -->
    <script src="js/script.js"></script>

</body>
</html>
